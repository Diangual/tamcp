version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tamcp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tamcp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tamcp_secure_password}
      POSTGRES_DB: ${DB_NAME:-tamcp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tamcp-network

  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: tamcp_db_backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME:-tamcp}
      - POSTGRES_USER=${DB_USER:-tamcp}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-tamcp_secure_password}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=2
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    networks:
      - tamcp-network

  backend:
    image: ${DOCKER_USERNAME:-diangal}/tamcp-backend:latest
    build: ./tamcp-backend
    container_name: tamcp_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tamcp}
      - DB_PASSWORD=${DB_PASSWORD:-tamcp_secure_password}
      - DB_NAME=${DB_NAME:-tamcp}
      - NODE_ENV=production
    networks:
      - tamcp-network

  frontend:
    image: ${DOCKER_USERNAME:-diangal}/tamcp-app:latest
    build: ./tamcp-app
    container_name: tamcp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - tamcp-network

  caddy:
    image: caddy:2-alpine
    container_name: tamcp_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tamcp-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  tamcp-network:
    driver: bridge
