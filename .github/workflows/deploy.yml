name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./tamcp-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tamcp-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./tamcp-app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tamcp-app:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/deploy/tamcp
            
            # Récupérer les dernières modifications
            git pull origin main
            
            # Créer le fichier .env.production avec tous les secrets
            cat <<EOF > .env.production
            # Docker
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            # Base de données PostgreSQL
            DB_USER=tamcp
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=tamcp
            
            # Backend
            PORT=5000
            NODE_ENV=production
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=https://tamcp.org
            DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}
            
            # Email SMTP
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            EOF
            
            # Télécharger les nouvelles images depuis Docker Hub
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker-compose pull
            
            # Redémarrer les conteneurs avec les nouvelles images
            docker-compose up -d
            
            # Nettoyer les anciennes images pour libérer de l'espace
            docker image prune -f
            
            echo "✅ Déploiement TamCP terminé sur tamcp.org"
